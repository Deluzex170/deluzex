name: CI / Build Validation

on:
  push:
    branches: [ "main", "dev", "kb23", "Test", "test" ]
  pull_request:
    branches: [ "main", "dev", "Test", "test" ]

jobs:
  backend-smoke:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd mongosh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONGODB_URI: mongodb://localhost:27017/deluzex_ci
      MONGODB_DATABASE: deluzex_ci
      SECRET_KEY: deluzex_production_jwt_secret_change_me_super_secure_key_2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - name: Verify backend routes and deployment entrypoint
        run: python -m unittest discover -s backend/tests -v

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Lint
        run: npm run lint
        continue-on-error: true

      - name: Build Next.js project
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: /api/v1
